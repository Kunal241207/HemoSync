services:
  postgres:
    image: postgres:16-alpine
    container_name: hemosync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hemosync
      POSTGRES_USER: hemosync
      POSTGRES_PASSWORD: hemosync
    ports:
      - "5432:5432"
    volumes:
      - hemosync-postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hemosync -d hemosync"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hemosync-postgres-data:
